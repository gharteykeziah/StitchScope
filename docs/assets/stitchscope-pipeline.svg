<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">StitchScope: image identification to validated crochet instructions</title>
<desc id="desc">Each image region is identified, resolved against a physically confirmed library, simulated row by row, and rendered only if valid. The production library is currently empty. Failures produce no instructions.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183044}.label{font-size:12px;font-weight:700;letter-spacing:1.5px}.heading{font-size:20px;font-weight:700}.body{font-size:15px;fill:#43596b}.small{font-size:13px;fill:#536879}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="660" rx="24" fill="#f6f8fb"/>
<text x="42" y="43" class="label">STITCHSCOPE / SYSTEM ARCHITECTURE</text>
<text x="42" y="82" font-size="30" font-weight="700">Identify the fabric. Validate the recipe.</text>
<text x="42" y="112" class="body">One independent pipeline per region · flat turned rows · trusted library instructions only</text>
<rect x="42" y="160" width="224" height="176" rx="16" fill="#e8edf9" stroke="#c5cfe9"/>
<text x="62" y="189" class="label">01 / IMAGE</text>
<rect x="62" y="208" width="58" height="48" rx="8" fill="#fff" stroke="#9cadd3"/>
<circle cx="104" cy="220" r="5" fill="#c49d69"/>
<path d="m68 248 15-20 13 13 9-8 10 15" fill="none" stroke="#7189b5" stroke-width="2"/>
<text x="62" y="286" class="heading">Crochet photograph</text>
<text x="62" y="312" class="body">Cuff · body · trim · hem</text>
<path d="M266 248 H308" class="flow"/>
<rect x="316" y="160" width="240" height="176" rx="16" fill="#ede9f7" stroke="#d0c5e8"/>
<text x="336" y="189" class="label">02 / IDENTIFICATION</text>
<text x="336" y="223" class="heading">Claude vision</text>
<text x="336" y="254" class="body">Stitch name + region</text>
<text x="336" y="278" class="body">Confidence + uncertainty</text>
<text x="336" y="312" class="small">AI instruction fields discarded</text>
<path d="M556 248 H598" class="flow"/>
<rect x="606" y="160" width="254" height="176" rx="16" fill="#fff2de" stroke="#e6cca0"/>
<text x="626" y="189" class="label">03 / TRUST GATE</text>
<text x="626" y="223" class="heading">Resolve the identity</text>
<text x="626" y="254" class="body">Exact ID / normalized aliases</text>
<text x="626" y="278" class="body">One CONFIRMED match</text>
<text x="626" y="312" class="small">Confidence never grants trust</text>
<rect x="916" y="173" width="242" height="150" rx="16" fill="#fff" stroke="#d7c9ac"/>
<text x="936" y="203" class="label">V2 RECIPE LIBRARY</text>
<text x="936" y="235" class="body">Schema-validated recipes</text>
<text x="936" y="259" class="body">Physical confirmation required</text>
<text x="936" y="297" class="small">Production library: currently empty</text>
<path d="M916 248 H868" class="flow"/>
<path d="M733 336 V399" class="flow"/>
<text x="744" y="373" class="small">Trusted match</text>
<rect x="606" y="407" width="552" height="159" rx="16" fill="#e7f3ef" stroke="#b7d8cb"/>
<text x="626" y="438" class="label">04 / MATHEMATICAL SIMULATION</text>
<text x="626" y="471" class="heading">Foundation → Row 1 → Later rows</text>
<text x="626" y="500" class="body">Ordered stitch posts + chain spaces · forward traversal</text>
<text x="626" y="525" class="body">Reverse output between rows to model turning the work</text>
<text x="626" y="548" class="small">Stop at the first invalid row; report unsupported semantics</text>
<path d="M606 478 H564" class="flow"/>
<text x="580" y="464" text-anchor="middle" class="small">Pass</text>
<rect x="316" y="407" width="240" height="159" rx="16" fill="#e4f0f8" stroke="#b9d5e8"/>
<text x="336" y="438" class="label">05 / RENDERING</text>
<text x="336" y="472" class="heading">Readable swatch plan</text>
<text x="336" y="502" class="body">Foundation + row instructions</text>
<text x="336" y="527" class="body">US stitch terminology</text>
<text x="336" y="549" class="small">Library recipe + validated plan</text>
<rect x="42" y="407" width="224" height="159" rx="16" fill="#faeae8" stroke="#e7c3bf"/>
<text x="62" y="438" class="label">SAFE FAILURE</text>
<text x="62" y="472" class="heading">No instructions</text>
<text x="62" y="502" class="body">No trusted match, ambiguity,</text>
<text x="62" y="527" class="body">or failed validation</text>
<path d="M674 336 V363 H154 V399" class="flow" stroke-dasharray="5 5"/>
<text x="300" y="386" class="small">Unresolved / unconfirmed</text>
<path d="M885 566 V597 H154 V574" class="flow" stroke-dasharray="5 5"/>
<text x="590" y="629" text-anchor="middle" class="small">Invalid or unsupported simulation → no partial pattern</text>
</svg>
