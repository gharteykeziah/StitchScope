<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">StitchScope — from visual identification to trusted crochet instructions</title>
<desc id="desc">Five stages flow left to right: photograph, vision-language identification, confirmed recipe resolution, ordered row simulation, and instruction rendering. AI instruction fields are discarded. Unresolved identities or failed validation produce no instructions. The production recipe library is currently empty.</desc>
<defs>
<linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fcfaf7"/><stop offset="1" stop-color="#f0f4f7"/></linearGradient>
<filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#263448" flood-opacity=".06"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#8c99a6" stroke-width="1.5"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253447}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:15px;fill:#677484}.note{font-size:13px;fill:#677484}.wire{fill:none;stroke:#8c99a6;stroke-width:1.7;marker-end:url(#arrow)}</style>
</defs>
<rect width="1600" height="760" rx="28" fill="url(#paper)"/>
<text x="60" y="61" class="eyebrow" fill="#8269bd">STITCHSCOPE / PIPELINE ARCHITECTURE</text>
<text x="60" y="113" font-size="38" font-weight="700">From visual recognition to trusted construction.</text>
<text x="60" y="148" class="body">Region-specific identification → physically confirmed recipes → deterministic validation → readable instructions</text>
<rect x="60" y="180" width="566" height="32" rx="16" fill="#eee8f6"/>
<text x="343" y="201" text-anchor="middle" class="eyebrow" style="fill:#8269bd;font-size:10px">PROBABILISTIC IDENTIFICATION</text>
<rect x="648" y="180" width="892" height="32" rx="16" fill="#e7efeb"/>
<text x="1094" y="201" text-anchor="middle" class="eyebrow" style="fill:#488d83;font-size:10px">TRUST-GATED, DETERMINISTIC EXECUTION</text>
